name: shefu
description: Offline recipes manager
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: "none" # Remove this line if you wish to publish to pub.dev

version: 4.6.0+2903

environment:
  sdk: ^3.14.0
  flutter: 3.50.0

dependencies:
  file_picker: ^13.3.3
  flag: ^7.1.0
  flutter:
    sdk: flutter
  command_it: ^9.5.2
  go_router: ^18.1.4
  flutter_form_builder: ^11.0.0
  flutter_localizations:
    sdk: flutter
  flutter_svg: ^2.4.0
  fraction: ^5.0.5
  image: ^4.13.1
  intl: ^0.20.3
  path: ^1.9.1
  path_provider: ^2.1.6
  provider: ^6.1.5+1
  riverpod: ^3.5.0
  pinch_zoom: ^2.0.1
  csv: ^8.0.0
  shared_preferences: ^2.5.6
  country_picker: ^2.0.28
  tutorial_coach_mark: ^1.3.4
  logger: ^2.8.0
  image_picker: ^1.2.4
  html: ^0.15.7
  http: ^1.6.0
  audioplayers: ^6.8.1
  drift: ^2.35.4
  drift_flutter: ^0.3.1
  flat_buffers: ^25.9.23
  sqlite3: ^3.9.1
  wakelock_plus: ^1.8.2
  url_launcher: ^6.3.3
  video_player: ^2.14.1
  youtube_player_flutter: ^10.0.1
  pdf: ^3.13.1
  archive: ^4.7.1
  share_plus: ^13.3.1
  printing: ^5.15.1
  speak: ^0.2.3
  package_info_plus: ^10.2.2
  dynamic_color: ^2.1.0

  material_ui: ^1.11.0
  cupertino_ui: any
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.16.1
  drift_dev: ^2.35.3
  test: ^1.31.1
  integration_test:
    sdk: flutter
  nested: ^1.0.0
  shared_preferences_platform_interface: ^2.4.2

# The following section is specific to Flutter packages.
flutter:
  generate: true
  uses-material-design: true

  assets:
    - assets/icons/
    - assets/icons/nutrients/
    - assets/glossary/
    - assets/nutrients_full.csv
    - assets/conversions_full.csv
    - assets/notification-ping-335500.mp3 # from https://pixabay.com/sound-effects/notification-ping-335500/
